name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[neural]"

      - name: Compile package
        run: python -m compileall -q industrial_rl experiments tests

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Inventory benchmark smoke
        run: python experiments/inventory_control.py

      - name: Constrained-capacity benchmark smoke
        run: python experiments/constrained_capacity.py

      - name: Offline-RL benchmark smoke
        run: python experiments/offline_inventory.py

      - name: DQN inventory smoke
        run: python experiments/neural_inventory_dqn.py --smoke

      - name: PPO workforce smoke
        run: python experiments/workforce_ppo.py --smoke

      - name: SAC energy-production smoke
        run: python experiments/energy_production_sac.py --smoke

      - name: Safe workforce CMDP smoke
        run: python experiments/safe_workforce_ppo.py --smoke

      - name: Risk-aware inventory smoke
        run: python experiments/risk_aware_inventory.py --smoke

      - name: POMDP maintenance smoke
        run: python experiments/pomdp_maintenance.py --smoke


      - name: Model-based control smoke
        run: python experiments/model_based_production_control.py --smoke

      - name: Transfer and domain-randomization smoke
        run: python experiments/transfer_domain_randomization.py --smoke

      - name: Latent-state control smoke
        run: python experiments/latent_state_control.py --smoke
