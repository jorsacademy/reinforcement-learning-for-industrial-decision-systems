[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-control-mpc-vs-rl"
version = "0.1.0"
description = "Industrial production control benchmark comparing rule-based, MPC, PPO and SAC controllers."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "gymnasium>=0.29",
  "pandas>=2.0",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
